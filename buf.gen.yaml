version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: proto
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: proto
    opt: paths=source_relative
  # Component dispatch wiring from (angzarr.v1.component) declarations.
  - local: ["go", "run", "./cmd/protoc-gen-angzarr"]
    out: proto
    opt: paths=source_relative
