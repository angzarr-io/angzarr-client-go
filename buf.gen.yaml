version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: proto
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: proto
    opt: paths=source_relative
  # Component dispatch wiring from (angzarr.v1.component) declarations,
  # generated by the shared angzarr CLI (github.com/angzarr-io/angzarr-cli)
  # at the version pinned in go.mod.
  - local: ["go", "tool", "angzarr-cli", "codegen", "go"]
    out: proto
    opt: paths=source_relative
